<text x="900.0" y="47.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="35" fill="#22334A">当前自研架构：RulerDirect-V2</text>
<text x="900.0" y="107.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">PretrainingModel → CalibratedDecoder｜实线：推理数据流｜蓝：图像｜橙：标定｜紫：候选解码</text>
<rect x="500" y="155" width="800" height="135" rx="12" fill="#EAF2FF" stroke="#477BC2" stroke-width="2"/>
<text x="900.0" y="189.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">① RGB与有效掩码：示例 B=1，N=4</text>
<text x="900.0" y="222.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">主图 [B,N,3,256,448]；匹配图 [B,N,3,512,896]</text>
<text x="900.0" y="255.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">两种尺寸分别从原始RGB缩放；targets不进入模型</text>
<rect x="50" y="365" width="740" height="180" rx="12" fill="#EAF2FF" stroke="#477BC2" stroke-width="2"/>
<text x="420.0" y="405.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">②a MatchingPyramid：全部有效视图共享</text>
<text x="420.0" y="438.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">ImageNet ResNet-18 → 四级侧投影 → 对齐FPN</text>
<text x="420.0" y="471.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">输出F4/F8/F16，各64维；负责纹理与定位</text>
<text x="420.0" y="504.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">编码器参与训练，非冻结Hero特征</text>
<rect x="1010" y="365" width="740" height="180" rx="12" fill="#EAF2FF" stroke="#477BC2" stroke-width="2"/>
<text x="1380.0" y="405.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">②b TrainableFoundation：本次参考图</text>
<text x="1380.0" y="438.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">原始DA-V2 ViT-B／12块，取第3/6/9/12块</text>
<text x="1380.0" y="471.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">四张 [B,768,16,28] 上下文图</text>
<text x="1380.0" y="504.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">负责结构与场景理解；分阶段解冻</text>
<rect x="40" y="620" width="380" height="240" rx="12" fill="#FFF3DF" stroke="#C48836" stroke-width="2"/>
<text x="230.0" y="665.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">独立几何输入</text>
<text x="230.0" y="695.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">K：主图内参</text>
<text x="230.0" y="725.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">T_cam_from_rig：阵列→相机</text>
<text x="230.0" y="755.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">每域固定 near / far / s</text>
<text x="230.0" y="785.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">平移与候选除以 s</text>
<text x="230.0" y="815.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">范围来自TRAIN配置，非本帧GT</text>
<rect x="1380" y="620" width="380" height="240" rx="12" fill="#EAF2FF" stroke="#477BC2" stroke-width="2"/>
<text x="1570.0" y="661.25" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">上下文准备／重复使用</text>
<text x="1570.0" y="692.75" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">四个独立1×1卷积</text>
<text x="1570.0" y="724.25" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">768 → 128 维</text>
<text x="1570.0" y="755.75" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">按真实patch中心对齐</text>
<text x="1570.0" y="787.25" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">粗层：32×56</text>
<text x="1570.0" y="818.75" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">细层：64×112</text>
<rect x="500" y="610" width="800" height="140" rx="12" fill="#F1ECFF" stroke="#8665BC" stroke-width="2"/>
<text x="900.0" y="647.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">③ 全范围粗候选：set_range + depth_lattice</text>
<text x="900.0" y="680.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">每个stride-8像素沿射线布置96个对数深度候选</text>
<text x="900.0" y="713.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">候选位置 [B,96,32,56]，采用工作单位</text>
<rect x="500" y="825" width="800" height="180" rx="12" fill="#F1ECFF" stroke="#8665BC" stroke-width="2"/>
<text x="900.0" y="865.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">④ _observe + CandidateViewAttention</text>
<text x="900.0" y="898.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">候选精确投影 → 标尺选择特征尺度 → 采样源特征</text>
<text x="900.0" y="931.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">成对特征MLP + 4头源视图注意力 + 无匹配槽位</text>
<text x="900.0" y="964.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">四目时只计算3个源；几何无效源被屏蔽</text>
<rect x="500" y="1080" width="800" height="180" rx="12" fill="#F1ECFF" stroke="#8665BC" stroke-width="2"/>
<text x="900.0" y="1122.75" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">⑤ 候选解释：_tokens_from_source + CandidateScaleSpace</text>
<text x="900.0" y="1154.25" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">66→64证据编码 + 深度位置编码 + 四层上下文读取</text>
<text x="900.0" y="1185.75" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">在32×56／16×28／8×14三个空间尺度交换候选信息</text>
<text x="900.0" y="1217.25" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">保留全部96个深度格；得到 [B,64,96,32,56]</text>
<rect x="500" y="1335" width="800" height="185" rx="12" fill="#F1ECFF" stroke="#8665BC" stroke-width="2"/>
<text x="900.0" y="1378.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">⑥ 粗预测 + SubrayTransport</text>
<text x="900.0" y="1411.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">分数头与有界连续偏移 → 96项候选概率</text>
<text x="900.0" y="1444.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">先传递全部概率到64×112细网格，再选4个峰</text>
<text x="900.0" y="1477.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#22334A">每峰按标尺步长取3点；共12个候选，并继承粗特征</text>
<rect x="500" y="1595" width="800" height="205" rx="12" fill="#F1ECFF" stroke="#8665BC" stroke-width="2"/>
<text x="900.0" y="1634.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">⑦ 细层重新取证与选面：_observe → _tokens → _prediction</text>
<text x="900.0" y="1666.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">12个候选重新精确投影，复用④的注意力与⑤的上下文读取</text>
<text x="900.0" y="1697.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">加上1×1×1投影后的继承特征，再做通道LayerNorm</text>
<text x="900.0" y="1729.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">共享粗层分数/偏移头；取最高分候选，输出连续深度</text>
<text x="900.0" y="1760.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">细层不再执行CandidateScaleSpace</text>
<rect x="500" y="1875" width="800" height="145" rx="12" fill="#F1ECFF" stroke="#8665BC" stroke-width="2"/>
<text x="900.0" y="1916.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">⑧ _upsample：学习式4倍凸组合上采样</text>
<text x="900.0" y="1947.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">选中候选特征 → Conv3×3 → GELU → Conv1×1</text>
<text x="900.0" y="1979.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">预测9邻域×16子像素权重，将64×112恢复至256×448</text>
<rect x="500" y="2090" width="800" height="185" rx="12" fill="#E8F5EE" stroke="#408766" stroke-width="2"/>
<text x="900.0" y="2119.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">⑨ 单参考深度输出 [B,1,256,448]</text>
<text x="900.0" y="2151.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">导出时 depth × s，恢复该数据域的原始长度单位</text>
<text x="900.0" y="2182.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">同时给出 confidence / valid / support</text>
<text x="900.0" y="2214.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">当前 unknown=true，observed=false，state=2</text>
<text x="900.0" y="2245.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">表示深度假设；尚未认证为已观测表面</text>
<rect x="40" y="1080" width="380" height="245" rx="12" fill="#F2F3F5" stroke="#8D96A3" stroke-width="2"/>
<text x="230.0" y="1127.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">当前相机角色</text>
<text x="230.0" y="1157.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">所有相机共用CNN参数</text>
<text x="230.0" y="1187.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">一次forward指定一个参考相机</text>
<text x="230.0" y="1217.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">ViT只处理该参考图</text>
<text x="230.0" y="1247.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">请求其他参考要另做前向</text>
<text x="230.0" y="1277.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">当前入口未自动共享多参考编码</text>
<rect x="40" y="1600" width="380" height="220" rx="12" fill="#F2F3F5" stroke="#8D96A3" stroke-width="2"/>
<text x="230.0" y="1647.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">训练标签另走监督支路</text>
<text x="230.0" y="1678.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">GT深度与可见对应</text>
<text x="230.0" y="1710.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">只进入损失函数</text>
<text x="230.0" y="1741.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">不会成为推理输入</text>
<text x="230.0" y="1773.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">完整训练流程见第4页</text>
<rect x="1380" y="1080" width="380" height="245" rx="12" fill="#F2F3F5" stroke="#8D96A3" stroke-width="2"/>
<text x="1570.0" y="1123.75" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">尺寸读法</text>
<text x="1570.0" y="1155.25" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">B：一批图组数量</text>
<text x="1570.0" y="1186.75" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">N：输入相机数量</text>
<text x="1570.0" y="1218.25" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">C：特征通道数</text>
<text x="1570.0" y="1249.75" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">D：候选深度数量</text>
<text x="1570.0" y="1281.25" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#22334A">H×W：当前空间网格</text>
<rect x="1380" y="1600" width="380" height="245" rx="12" fill="#F2F3F5" stroke="#8D96A3" stroke-width="2"/>
<text x="1570.0" y="1647.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">本图不含的历史模块</text>
<text x="1570.0" y="1677.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">无完整Hero融合ViT／DPT</text>
<text x="1570.0" y="1707.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">无旧树头、GN后端或tele输入</text>
<text x="1570.0" y="1737.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">场景token分支关闭</text>
<text x="1570.0" y="1767.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">独立细头与峰内平均关闭</text>
<text x="1570.0" y="1797.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#22334A">可选浮点重排加速关闭</text>
</svg>