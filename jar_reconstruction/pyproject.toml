[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jar-reconstruction"
version = "0.1.0"
description = "RulerMVS V2/V3 calibrated multiview reconstruction and independent baselines"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy>=1.26", "Pillow>=10"]

[tool.setuptools.packages.find]
include = ["jar*"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '/(\.venv[^/]*|build_src|upstream)/'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
consider_namespace_packages = true
